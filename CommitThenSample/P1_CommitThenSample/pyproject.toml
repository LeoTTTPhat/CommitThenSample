[project]
name = "ctsample"
version = "0.1.0"
description = "Commit-then-Sample: verifiable, unpredictable AI-guided evidence retention with known sampling error"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pyarrow", "polars", "pandas", "lightgbm", "blake3", "cryptography", "dpkt", "pyyaml", "psutil"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]

# Pre-registered default hyper-parameters (DESIGN §3.10; Table "Defaults" in the supplement).
# Loaded by ctsample.config.load_yaml(); experiment YAMLs under config/experiments/ override keys.
# Changing ANY value changes cfg_hash() and therefore the results directory.

epoch:
  T_seconds: 30.0            # epoch length T
  commit_slack_seconds: 3.0  # Delta_c
  eps_beta_seconds: 1.0      # epsilon_beta
  two_rounds_ahead: false    # analytic-only option

content_cost: pcap           # s_i = sum_j (caplen_ij + 16) bytes

budget:
  rho: 0.05                  # headline budget: fraction of full-capture bytes
  rho_grid: [0.01, 0.02, 0.05, 0.10]
  mode: horizon              # horizon (default) | per_epoch (E7 ablation: end-of-epoch water-filling)

policy:
  gamma: 0.3                 # floor share
  gamma_grid: [0.1, 0.2, 0.3, 0.5]
  floor: constant            # phi0 = gamma*rho*sum_all s/sum_payload s on training folds | equalised (E7)
  tier: single               # phi_t = 1
  two_tier_ablation:
    H_bytes: 1024
    phi_t_grid: [0.1, 0.3, 0.5]
    m_grid: [1, 3, 10]
  tau_mix: 0.2               # defensive mixture weight on size-only
  tau_mix_grid: [0.0, 0.2, 0.5]
  controller:
    kappa: 1.0
    Wc_epochs: 30
    L: 2.772588722239781     # ln 16
    Dmax_mult: 200           # D_max = 200 * Bbar (flood guard threshold)
    lam_fixed_point_bits: 40 # Lam = round(lam * 2^40)
  boost:
    kappa_b: 5.0
    W_b_epochs: 20
    kappa_b_grid: [1.0, 5.0]  # E3: U5 vs U6
  rolling_window_epochs: 120

alpha: 0.05                  # two-sided; alpha/2 per side (alpha/(2|F|) under a declared family)

cs:
  lcs:
    K: 16
    decades: 2.0             # eta* x 10^[-2, 2], weights 1/K
    K_grid: [16, 32, 64]     # [SHOULD] ablation
    V_ref_epochs: 2880       # V_ref = training-fold per-epoch V of the estimand family x 2880
    alternative: normal_mixture   # [SHOULD] Howard et al. one-sided normal mixture
  ucs:
    w0: 0.5                  # weight on eta0 = 0.999/cbar
    eta0_frac: 0.999
    n_low: 15                # 15 points over 4 decades below eta0, weights 1/30
    decades: 4.0

lightgbm:
  n_trees: 200
  num_leaves: 31
  learning_rate: 0.05
  seeds: [0, 1, 2]

mc:
  reps_E2_headline: 1000
  reps_default: 500
  reps_ablation: 200
  report_every_epochs: 30
  width_reps: 200
  chunk_base: 64             # r_c = max(8, floor(64 * scale()))
  dcap_mode: normal          # non-hit part of Dcap: normal approximation (clipped) | expected
  withhold_rules: [void_unretained, void_retained, withhold_half, void_random]
  void_random_p: 0.3
  withhold_p: 0.5

reporting:
  wilson_z: 1.959963984540054
  bootstrap_resamples: 2000

# LLM scoring settings (DESIGN §3.4.3, §8.2, §10 R1) -- owner P2-F.
# The DYNAMIC decisions (main model, frozen prompt hash, prefix text) are written by scripts/19 to
# results/gates/prompt_freeze.json (+ results/gates/prompt_prefix_<hash>.txt); scripts/09 reads them there.
models:
  qwen7b: mlx-community/Qwen2.5-7B-Instruct-4bit
  qwen3moe: mlx-community/Qwen3-30B-A3B-Instruct-2507-4bit
  llama3b: mlx-community/Llama-3.2-3B-Instruct-4bit
pilot:
  candidates: [qwen7b, qwen3moe]   # DESIGN §10 R1: Qwen3-30B-A3B is main iff its dev in-band AUROC >= the 7B's
  n: 2000                          # in-band dev candidates (S_TON band), few-shot card candidates excluded
  sample_seed: 0
  min_auroc: 0.6                   # below: ONE prompt revision on dev only, then freeze
  card_tokenizer: qwen7b           # few-shot cards in the shared prefix are budgeted with this tokenizer
card_budget: 220                   # card + question tokens (scoring model's tokenizer)
kappa_target: 0.10                 # budget rule: -> 0.05 if MUST > ~10.5 h at the measured throughput
must_hours_max: 10.5
